<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="72%">
      <stop offset="0" stop-color="#21402E"/>
      <stop offset="1" stop-color="#0A160F"/>
    </radialGradient>
    <linearGradient id="hide" x1="0" x2="1">
      <stop offset="0" stop-color="#E2D3B3"/>
      <stop offset="0.45" stop-color="#F4ECDA"/>
      <stop offset="1" stop-color="#C9B68E"/>
    </linearGradient>
    <g id="arrow">
      <rect x="-4" y="0" width="8" height="150" rx="3" fill="#F4ECDA"/>
      <path d="M-3.5 14 C-17 21 -20 40 -19 70 L-3.5 57 Z" fill="#C4362C"/>
      <path d="M3.5 14 C17 21 20 40 19 70 L3.5 57 Z" fill="#9E2820"/>
      <path d="M-5.5 2 L-5.5 -10 L0 -4 L5.5 -10 L5.5 2 Z" fill="#F4ECDA"/>
    </g>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <g transform="translate(-4 10) rotate(26 200 200)">
    <use href="#arrow" transform="translate(200 186) rotate(-21) translate(0 -136)"/>
    <use href="#arrow" transform="translate(200 186) rotate(21) translate(0 -136)"/>
    <use href="#arrow" transform="translate(200 186) translate(0 -150)"/>
    <!-- body -->
    <path d="M160 182 L240 182 L231 336 L169 336 Z" fill="url(#hide)"/>
    <!-- bottom cap -->
    <path d="M167 332 L233 332 L230 350 Q200 366 170 350 Z" fill="#5E3C22"/>
    <!-- strap band -->
    <path d="M157 246 L243 246 L242 262 L158 262 Z" fill="#5E3C22"/>
    <!-- stitching -->
    <path d="M200 196 L200 236 M200 272 L200 324" stroke="#0A160F" stroke-opacity="0.25" stroke-width="3" stroke-dasharray="6 7" stroke-linecap="round"/>
    <!-- rim -->
    <rect x="152" y="170" width="96" height="20" rx="6" fill="#5E3C22"/>
    <rect x="152" y="170" width="96" height="4" rx="2" fill="#8A5E37"/>
  </g>
</svg>
